name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CAS_READ_TOKEN: ${{ secrets.CAS_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # @cas/spec-sync 는 비공개 저장소(common_agent_system)에 있다.
      # 토큰을 URL 에 박으면 로그·락파일로 새기 쉬우므로 credential helper 로만 넘긴다.
      # helper 는 pnpm install 이 git 을 부르는 순간 실행되므로, 토큰은 그 스텝에도
      # 환경변수로 살아 있어야 한다. 그래서 잡 단위로 둔다.
      - name: 비공개 저장소 접근 설정
        run: |
          git config --global credential."https://github.com".helper \
            '!f() { echo username=x-access-token; echo "password=$CAS_READ_TOKEN"; }; f'
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test
      # 키 없이도 빌드는 성공해야 한다. 값이 빈 문자열이 될 뿐이다.
      - run: pnpm build

  e2e:
    # 저니는 스텁으로 돈다. 진짜 SDK 에 붙는 테스트는 `e2e-live.yml` 에서 수동으로 돌린다 —
    # 여기에 넣으면 남의 서비스가 느린 날 우리 CI 가 빨개진다.
    runs-on: ubuntu-latest
    env:
      CAS_READ_TOKEN: ${{ secrets.CAS_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # @cas/spec-sync 는 비공개 저장소(common_agent_system)에 있다.
      # 토큰을 URL 에 박으면 로그·락파일로 새기 쉬우므로 credential helper 로만 넘긴다.
      # helper 는 pnpm install 이 git 을 부르는 순간 실행되므로, 토큰은 그 스텝에도
      # 환경변수로 살아 있어야 한다. 그래서 잡 단위로 둔다.
      - name: 비공개 저장소 접근 설정
        run: |
          git config --global credential."https://github.com".helper \
            '!f() { echo username=x-access-token; echo "password=$CAS_READ_TOKEN"; }; f'
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # 키는 주지 않는다. 스텁 서버는 자리를 채우는 값으로 빌드하고 SDK 요청은 가로챈다.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
