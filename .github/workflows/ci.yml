name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # @cas/spec-sync 는 비공개 저장소(common_agent_system)에 있다.
      # 토큰을 URL 에 박으면 로그·락파일로 새기 쉬우므로 credential helper 로만 넘긴다.
      - name: 비공개 저장소 접근 설정
        env:
          CAS_READ_TOKEN: ${{ secrets.CAS_READ_TOKEN }}
        run: |
          git config --global credential."https://github.com".helper \
            '!f() { echo username=x-access-token; echo password=$CAS_READ_TOKEN; }; f'
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test
      # 키 없이도 빌드는 성공해야 한다. 값이 빈 문자열이 될 뿐이다.
      - run: pnpm build
