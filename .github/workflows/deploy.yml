name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 남긴다. 진행 중인 배포는 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CAS_READ_TOKEN: ${{ secrets.CAS_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # @cas/spec-sync 는 비공개 저장소(common_agent_system)에 있다.
      # 토큰을 URL 에 박으면 로그·락파일로 새기 쉬우므로 credential helper 로만 넘긴다.
      # helper 는 pnpm install 이 git 을 부르는 순간 실행되므로, 토큰은 그 스텝에도
      # 환경변수로 살아 있어야 한다. 그래서 잡 단위로 둔다.
      - name: 비공개 저장소 접근 설정
        run: |
          git config --global credential."https://github.com".helper \
            '!f() { echo username=x-access-token; echo "password=$CAS_READ_TOKEN"; }; f'
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          # 시크릿이 아직 없어도 빌드는 통과한다. 그때는 지도 자리에 안내 문구가 뜬다.
          VITE_KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
